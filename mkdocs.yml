site_name: PostgreSQL Handbook
site_description: Hệ thống tài liệu PostgreSQL dành cho phát triển, vận hành và tối ưu hiệu năng
# URL mặc định cho local/dev; môi trường production dùng mkdocs.prod.yml
site_url: http://127.0.0.1:8000/

repo_url: https://www.postgresql.org/docs/current/
repo_name: Official PostgreSQL Docs

theme:
  name: material
  language: vi
  favicon: assets/images/favicon.svg
  icon:
    logo: simple/postgresql
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

hooks:
  - hooks/env_hook.py

nav:
  - Home: index.md
  - Guide:
      - Tổng quan: guide/index.md
      - Bắt đầu:
          - Kết nối bằng psql: guide/getting-started/psql.md
          - PostgreSQL với Docker: guide/getting-started/docker.md
      - SQL:
          - Truy vấn dữ liệu: guide/sql/queries.md
          - "Transaction & MVCC": guide/sql/transactions.md
      - Hiệu năng:
          - EXPLAIN ANALYZE: guide/performance/explain.md
          - Indexing: guide/performance/indexes.md
          - Quy trình tối ưu truy vấn: guide/performance/query-tuning.md
  - Operations:
      - Giới thiệu: operations/index.md
      - Theo dõi truy vấn: operations/monitoring.md
      - "VACUUM & ANALYZE": operations/vacuum.md
      - "Backup & Restore": operations/backup-restore.md
      - "Roles & Security": operations/security.md
      - High Level Database Concepts:
          - AICD: operations/high-level-database-concepts/aicd-concepts.md
          - Cơ chế MVCC: operations/high-level-database-concepts/co-che-mvcc.md
          - Cơ chế Write-Ahead Log (WAL): operations/high-level-database-concepts/co-che-write-ahead-log-wal.md
  - Best Practices:
      - Tổng quan: best-practices/index.md
      - Pagination: best-practices/pagination.md
      - Issues:
          - Xử lý bẫy Idle in Transaction: best-practices/issues/xu-ly-bay-idle-in-transaction.md
  - Troubleshooting:
      - Tổng quan: troubleshooting/index.md
      - Lỗi kết nối: troubleshooting/connections.md
      - Truy vấn bị khóa: troubleshooting/locking.md
      - Component khi tạo file 1: troubleshooting/components-share.md
  - Quản trị: admin.md
